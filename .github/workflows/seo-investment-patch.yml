name: Investment SEO Patch

on:
  push:
    branches:
      - seo/investment-cluster-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply confirmed SEO fixes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          sip = Path("src/components/tools/financeSuite/investment/sipReturnCalculatorSeoContent.tsx")
          text = sip.read_text(encoding="utf-8")
          expected = 'const TOOL_PATH = "/tools/calculator/roi-calculator";'
          replacement = 'const TOOL_PATH = "/tools/calculator/sip-calculator";'
          if expected in text:
              text = text.replace(expected, replacement, 1)
          related = '<RelatedTools toolId="calculator/roi-calculator" />'
          related_replacement = '<RelatedTools toolId="calculator/sip-calculator" />'
          if related in text:
              text = text.replace(related, related_replacement, 1)
          sip.write_text(text, encoding="utf-8")

          lumpsum = Path("src/components/tools/financeSuite/investment/lumpsumcalculatorseocontent.tsx")
          text = lumpsum.read_text(encoding="utf-8")
          start_marker = "\nfunction FAQSchema() {"
          end_marker = "\nexport default function LumpsumCalculatorSeoContent()"
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start >= 0 and end > start:
              text = text[:start] + "\n" + text[end:]
          text = text.replace("      <FAQSchema />\n", "", 1)
          lumpsum.write_text(text, encoding="utf-8")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", str(sip), str(lumpsum)], check=True)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode != 0:
              subprocess.run(["git", "diff", "--cached", "--check"], check=True)
              subprocess.run(["git", "commit", "-m", "seo: align investment calculator canonical references"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:seo/investment-cluster-fixes"], check=True)
