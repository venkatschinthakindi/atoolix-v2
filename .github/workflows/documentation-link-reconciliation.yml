name: Documentation SEO Validation

on:
  push:
    branches:
      - seo/documentation-link-reconciliation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (informational; repository baseline)
        continue-on-error: true
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm start > /tmp/atoolix-next.log 2>&1 &
          echo $! > /tmp/atoolix-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/atoolix-next.log
          exit 1

      - name: Validate legacy redirects
        run: |
          set -euo pipefail
          for path in \
            /tools/image/jpg-to-pdf \
            /tools/image/png-to-pdf \
            /tools/image/webp-to-pdf; do
            headers=$(curl -sS -D - -o /dev/null "http://127.0.0.1:3000${path}")
            echo "${path}"
            echo "${headers}"
            echo "${headers}" | grep -Eq '^HTTP/.* 30[18]$'
            echo "${headers}" | grep -Fi 'location: /tools/image/image-to-pdf'
          done

      - name: Validate consolidated page
        run: |
          set -euo pipefail
          html=$(curl -fsS http://127.0.0.1:3000/tools/image/image-to-pdf)
          echo "$html" | grep -F 'Image to PDF'
          echo "$html" | grep -F 'rel="canonical"'
          if echo "$html" | grep -Eq 'jpg-to-pdf|png-to-pdf|webp-to-pdf'; then
            echo 'Legacy PDF converter URLs leaked into consolidated page HTML.'
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/atoolix-next.pid ]; then
            kill "$(cat /tmp/atoolix-next.pid)" || true
          fi
