name: Deploy Atoolix

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run deploy-build

      - name: Create deployment archive
        run: tar -czf deploy.tar.gz -C deploy .

      - name: Upload deployment archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "deploy.tar.gz"
          target: "${{ secrets.SERVER_PATH }}/releases"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            APP_DIR="${{ secrets.SERVER_PATH }}"
            RELEASE=$(date +%Y%m%d-%H%M%S)

            mkdir -p "$APP_DIR/releases/$RELEASE"

            tar -xzf "$APP_DIR/releases/deploy.tar.gz" \
              -C "$APP_DIR/releases/$RELEASE"

            rm -f "$APP_DIR/releases/deploy.tar.gz"

            ln -sfn "$APP_DIR/releases/$RELEASE" "$APP_DIR/current"

            sudo systemctl restart atoolix.service

            cd "$APP_DIR/releases"
            ls -1dt */ | tail -n +4 | xargs -r rm -rf