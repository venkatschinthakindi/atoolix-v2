name: SEO Documentation Link Reconciliation

on:
  push:
    paths:
      - .github/workflows/seo-doc-link-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy documentation PDF variants
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/documentation/page.tsx")
          text = path.read_text(encoding="utf-8")

          legacy_items = [
              '''      {
                name: "JPG to PDF",
                href: "/tools/image/jpg-to-pdf",
                description:
                  "Convert supported JPG images into PDF documents.",
                useCases: [
                  "Convert photos to PDF",
                  "Prepare documents for upload",
                  "Create printable files",
                ],
                tips:
                  "Use a clear JPG image with the correct orientation.",
                related: [
                  "/tools/image/image-to-pdf",
                  "/tools/image/png-to-pdf",
                ],
              },
''',
              '''      {
                name: "PNG to PDF",
                href: "/tools/image/png-to-pdf",
                description:
                  "Convert supported PNG images into PDF documents.",
                useCases: [
                  "Convert screenshots",
                  "Prepare graphics",
                  "Create printable documents",
                ],
                tips:
                  "Check image dimensions and orientation before conversion.",
                related: [
                  "/tools/image/image-to-pdf",
                  "/tools/image/jpg-to-pdf",
                ],
              },
''',
              '''      {
                name: "WebP to PDF",
                href: "/tools/image/webp-to-pdf",
                description:
                  "Convert supported WebP images into PDF documents.",
                useCases: [
                  "Convert web images",
                  "Prepare files for upload",
                  "Create PDF documents",
                ],
                tips:
                  "Use the original WebP image when preserving its source quality matters.",
                related: [
                  "/tools/image/image-to-pdf",
                  "/tools/image/jpg-to-pdf",
                  "/tools/image/png-to-pdf",
                ],
              },
''',
          ]

          for block in legacy_items:
              if text.count(block) != 1:
                  raise SystemExit(f"Expected exactly one legacy documentation block, found {text.count(block)}")
              text = text.replace(block, "")

          old_image_to_pdf_related = '''        related: [
          "/tools/image/jpg-to-pdf",
          "/tools/image/png-to-pdf",
          "/tools/image/webp-to-pdf",
        ],'''
          new_image_to_pdf_related = '''        related: [
          "/tools/pdf/merge-pdf",
          "/tools/pdf/split-pdf",
          "/tools/pdf/compress-pdf",
        ],'''
          if text.count(old_image_to_pdf_related) != 1:
              raise SystemExit("Expected exactly one Image to PDF legacy related-links block")
          text = text.replace(old_image_to_pdf_related, new_image_to_pdf_related)

          for legacy_url in (
              "/tools/image/jpg-to-pdf",
              "/tools/image/png-to-pdf",
              "/tools/image/webp-to-pdf",
          ):
              if legacy_url in text:
                  raise SystemExit(f"Legacy URL remains in documentation page: {legacy_url}")

          path.write_text(text, encoding="utf-8")

      - name: Verify documentation source
        run: |
          ! grep -nE '/tools/image/(jpg|png|webp)-to-pdf' src/app/documentation/page.tsx
          grep -n 'href: "/tools/image/image-to-pdf"' src/app/documentation/page.tsx
          grep -n 'name: "Image to PDF"' src/app/documentation/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit source change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/documentation/page.tsx
          git rm .github/workflows/seo-doc-link-reconcile.yml
          git commit -m "seo: consolidate documentation image-to-pdf links"
          git push
