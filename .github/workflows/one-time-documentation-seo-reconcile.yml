name: One-time Documentation SEO Reconciliation

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'seo/documentation-link-reconciliation' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: seo/documentation-link-reconciliation
          fetch-depth: 0

      - name: Reconcile Documentation links
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/app/documentation/page.tsx")
          text = path.read_text(encoding="utf-8")

          legacy = [
              "/tools/image/jpg-to-pdf",
              "/tools/image/png-to-pdf",
              "/tools/image/webp-to-pdf",
          ]

          for value in legacy:
              if value not in text:
                  raise SystemExit(f"Expected legacy URL missing from source: {value}")

          old_related = '''        related: [
          "/tools/image/jpg-to-pdf",
          "/tools/image/png-to-pdf",
          "/tools/image/webp-to-pdf",
        ],'''
          new_related = '''        related: [
          "/tools/pdf/merge-pdf",
          "/tools/pdf/split-pdf",
          "/tools/pdf/compress-pdf",
        ],'''
          if text.count(old_related) != 1:
              raise SystemExit("Expected exactly one Image to PDF legacy related-links block")
          text = text.replace(old_related, new_related, 1)

          patterns = [
              r'''\n      \{\n        name: "JPG to PDF",.*?\n      \},\n      \{\n        name: "PNG to PDF",''',
              r'''\n      \{\n        name: "PNG to PDF",.*?\n      \},\n      \{\n        name: "WebP to PDF",''',
          ]

          # Remove JPG and PNG entries while preserving the next object opener.
          for pattern in patterns:
              updated, count = re.subn(pattern, "\n      {\n        name: " + ("PNG to PDF" if "JPG to PDF" in pattern else "WebP to PDF") + ",", text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one documentation object boundary for pattern: {pattern}")
              text = updated

          webp_pattern = r'''\n      \{\n        name: "WebP to PDF",.*?\n      \},\n    \],\n  \},'''
          text, count = re.subn(webp_pattern, "\n    ],\n  },", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Expected exactly one WebP to PDF documentation object")

          for value in legacy:
              if value in text:
                  raise SystemExit(f"Legacy URL still present in active Documentation source: {value}")

          path.write_text(text, encoding="utf-8")

      - name: Verify source shape
        run: |
          test "$(grep -c 'name: \"Image to PDF\"' src/app/documentation/page.tsx)" -eq 1
          ! grep -n '/tools/image/jpg-to-pdf\|/tools/image/png-to-pdf\|/tools/image/webp-to-pdf' src/app/documentation/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync SEO execution MD and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("SEO_EXECUTION_ADDENDUM_2026-08-23_DOCUMENTATION_LINK_RECONCILIATION_STATUS.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "The Documentation source still contains these legacy internal destinations:\n- `/tools/image/jpg-to-pdf`\n- `/tools/image/png-to-pdf`\n- `/tools/image/webp-to-pdf`",
              "The Documentation source reconciliation is complete: the three legacy destinations are no longer used by active Documentation navigation."
          )
          text = text.replace(
              "## Required source change\nKeep the single active Documentation entry:\n- Image to PDF → `/tools/image/image-to-pdf`\n\nRemove the standalone JPG to PDF, PNG to PDF, and WebP to PDF Documentation entries. Replace the Image to PDF related links with relevant active PDF destinations. Do not remove the legacy route redirects.",
              "## Completed source change\nKeep the single active Documentation entry:\n- Image to PDF → `/tools/image/image-to-pdf`\n\nThe standalone JPG to PDF, PNG to PDF, and WebP to PDF Documentation entries were removed. Image to PDF now links to relevant active PDF destinations. Legacy route redirects were not modified."
          )
          text = text.replace(
              "## Execution status\nA temporary GitHub Actions reconciliation mechanism was tested but was removed without changing the source file. The latest `main` commit is therefore a cleanup commit, not a false completion of the SEO source task.\n\nThe current GitHub connector can retrieve the complete source blob but its direct file-update operation requires the complete replacement text. No truncated source has been blindly reconstructed or overwritten.",
              "## Execution status\nThe source reconciliation was applied from a controlled branch and validated by the repository build. No route redirects were removed or changed."
          )
          text = text.replace(
              "## Next phase\nComplete the actual Documentation source reconciliation first. After successful build and production validation, continue to measured production HTML and Core Web Vitals/performance work, followed by Search Console measurement.",
              "## Next phase\nRepository source reconciliation is complete. Continue with repository-wide legacy-link verification, redirect/canonical/sitemap validation, production rendered HTML validation, measured Core Web Vitals/performance work, and then Search Console measurement."
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/one-time-documentation-seo-reconcile.yml

      - name: Commit reconciled source and synchronized MD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/documentation/page.tsx SEO_EXECUTION_ADDENDUM_2026-08-23_DOCUMENTATION_LINK_RECONCILIATION_STATUS.md .github/workflows/one-time-documentation-seo-reconcile.yml
          git diff --cached --check
          git commit -m "seo: consolidate documentation PDF links"
          git push origin HEAD:seo/documentation-link-reconciliation
