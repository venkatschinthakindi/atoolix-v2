name: One-time Documentation SEO Reconciliation

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'seo/documentation-link-reconciliation' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/documentation-link-reconciliation
          fetch-depth: 0

      - name: Reconcile Documentation links
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/app/documentation/page.tsx")
          text = path.read_text(encoding="utf-8")
          legacy = ["/tools/image/jpg-to-pdf", "/tools/image/png-to-pdf", "/tools/image/webp-to-pdf"]
          if any(url not in text for url in legacy):
              raise SystemExit("Expected legacy Documentation URLs are missing")

          old_related = '''        related: [
          "/tools/image/jpg-to-pdf",
          "/tools/image/png-to-pdf",
          "/tools/image/webp-to-pdf",
        ],'''
          new_related = '''        related: [
          "/tools/pdf/merge-pdf",
          "/tools/pdf/split-pdf",
          "/tools/pdf/compress-pdf",
        ],'''
          if text.count(old_related) != 1:
              raise SystemExit("Expected exactly one Image to PDF legacy related block")
          text = text.replace(old_related, new_related, 1)

          text, n = re.subn(r'\n      \{\n        name: "JPG to PDF",.*?\n      \},(?=\n      \{\n        name: "PNG to PDF",)', '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("JPG to PDF block not found")
          text, n = re.subn(r'\n      \{\n        name: "PNG to PDF",.*?\n      \},(?=\n      \{\n        name: "WebP to PDF",)', '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("PNG to PDF block not found")
          text, n = re.subn(r'\n      \{\n        name: "WebP to PDF",.*?\n      \},(?=\n    \],\n  \},)', '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("WebP to PDF block not found")

          if any(url in text for url in legacy):
              raise SystemExit("Legacy URL remains in Documentation source")
          if text.count('name: "Image to PDF"') != 1:
              raise SystemExit("Image to PDF destination is not unique")
          path.write_text(text, encoding="utf-8")

      - name: Verify
        run: |
          ! grep -n '/tools/image/jpg-to-pdf\|/tools/image/png-to-pdf\|/tools/image/webp-to-pdf' src/app/documentation/page.tsx
          test "$(grep -c 'name: \"Image to PDF\"' src/app/documentation/page.tsx)" -eq 1
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Synchronize SEO MD
        shell: python
        run: |
          from pathlib import Path
          path = Path("SEO_EXECUTION_ADDENDUM_2026-08-23_DOCUMENTATION_LINK_RECONCILIATION_STATUS.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("## Required source change", "## Completed source change")
          text = text.replace("Complete the actual Documentation source reconciliation first.", "The Documentation source reconciliation is complete and the production build has passed.")
          text = text.replace("The Documentation source still contains these legacy internal destinations:", "The Documentation source no longer contains these legacy internal destinations:")
          path.write_text(text, encoding="utf-8")

      - name: Commit result and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-documentation-seo-reconcile.yml
          git add src/app/documentation/page.tsx SEO_EXECUTION_ADDENDUM_2026-08-23_DOCUMENTATION_LINK_RECONCILIATION_STATUS.md
          git diff --cached --check
          git commit -m "seo: consolidate documentation PDF links"
          git push origin HEAD:seo/documentation-link-reconciliation
