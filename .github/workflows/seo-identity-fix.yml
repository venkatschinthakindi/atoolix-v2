name: SEO identity fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[seo-identity-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply exact stale identity corrections
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("src/app/documentation/page.tsx"): [
                  ('href: "/tools/calculator/sip-calculator",\n    label: "ROI Calculator",',
                   'href: "/tools/calculator/sip-calculator",\n    label: "SIP Calculator",'),
                  ('name: "ROI Calculator",\n        href: "/tools/calculator/sip-calculator",',
                   'name: "SIP Calculator",\n        href: "/tools/calculator/sip-calculator",'),
              ],
              Path("src/app/disclaimer/page.tsx"): [
                  ('href: "/tools/calculator/sip-calculator",\n    label: "ROI Calculator",',
                   'href: "/tools/calculator/sip-calculator",\n    label: "SIP Calculator",'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one occurrence in {path}: {old!r}; found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Validate exact diff and stale identity removal
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/app/documentation/page.tsx src/app/disclaimer/page.tsx
          ! grep -n 'href: "/tools/calculator/sip-calculator",[[:space:]]*$' src/app/documentation/page.tsx | grep -A1 'ROI Calculator' || true
          ! grep -n 'href: "/tools/calculator/sip-calculator",[[:space:]]*$' src/app/disclaimer/page.tsx | grep -A1 'ROI Calculator' || true
          ! grep -n 'name: "ROI Calculator"' src/app/documentation/page.tsx
          ! grep -n 'label: "ROI Calculator"' src/app/documentation/page.tsx
          ! grep -n 'label: "ROI Calculator"' src/app/disclaimer/page.tsx

      - name: Install dependencies and lint
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Commit verified SEO correction and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/seo-identity-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/documentation/page.tsx src/app/disclaimer/page.tsx .github/workflows/seo-identity-fix.yml
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- src/app/documentation/page.tsx src/app/disclaimer/page.tsx
          git commit -m "seo: align legacy ROI references with SIP identity [seo-identity-fix]"
          git push origin main
