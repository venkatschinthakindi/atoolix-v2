name: SEO identity fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[seo-identity-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply exact SEO identity corrections
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("src/app/documentation/page.tsx"): [
                  ('href: "/tools/calculator/sip-calculator",\n    label: "ROI Calculator",',
                   'href: "/tools/calculator/sip-calculator",\n    label: "SIP Calculator",'),
                  ('name: "ROI Calculator",\n        href: "/tools/calculator/sip-calculator",',
                   'name: "SIP Calculator",\n        href: "/tools/calculator/sip-calculator",'),
              ],
              Path("src/app/disclaimer/page.tsx"): [
                  ('href: "/tools/calculator/sip-calculator",\n    label: "ROI Calculator",',
                   'href: "/tools/calculator/sip-calculator",\n    label: "SIP Calculator",'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one occurrence in {path}: found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Verify exact SEO diff
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/app/documentation/page.tsx src/app/disclaimer/page.tsx
          test "$(git diff --numstat -- src/app/documentation/page.tsx | awk '{print $1}')" = "1"
          test "$(git diff --numstat -- src/app/disclaimer/page.tsx | awk '{print $1}')" = "1"
          if grep -Fq 'href: "/tools/calculator/sip-calculator",' src/app/documentation/page.tsx && grep -Fq 'label: "ROI Calculator"' src/app/documentation/page.tsx; then exit 1; fi
          if grep -Fq 'href: "/tools/calculator/sip-calculator",' src/app/disclaimer/page.tsx && grep -Fq 'label: "ROI Calculator"' src/app/disclaimer/page.tsx; then exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified correction and remove workflow
        run: |
          set -euo pipefail
          rm .github/workflows/seo-identity-fix.yml
          git add src/app/documentation/page.tsx src/app/disclaimer/page.tsx .github/workflows/seo-identity-fix.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "seo: align legacy ROI references with SIP identity [seo-identity-fix]"
          git push origin main
