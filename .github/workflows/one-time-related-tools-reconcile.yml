name: One-time Related Tools SEO Reconciliation

on:
  push:
    branches:
      - seo/related-tools-registry-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile active relatedTools registry references
        id: reconcile
        env:
          TARGETS: 'image/jpg-to-pdf,image/png-to-pdf,image/webp-to-pdf'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          path = Path('src/data/tools.ts')
          text = path.read_text()
          targets = [x for x in os.environ['TARGETS'].split(',') if x]

          # Remove only the confirmed archived IDs from active relatedTools arrays.
          for tool_id in targets:
              pattern = r'(?P<prefix>relatedTools:\s*\[)(?P<body>.*?)(?P<suffix>\])'
              blocks = list(re.finditer(pattern, text, flags=re.S))
              for m in reversed(blocks):
                  body = m.group('body')
                  if tool_id in body:
                      new_body = re.sub(rf'(["\']){re.escape(tool_id)}\1\s*,?\s*', '', body)
                      text = text[:m.start('body')] + new_body + text[m.end('body'):]

          path.write_text(text)
          print('Applied targeted relatedTools cleanup.')
          PY

      - name: Verify public documentation source has no legacy PDF-format links
        run: |
          if grep -nE 'jpg-to-pdf|png-to-pdf|webp-to-pdf' src/app/documentation/page.tsx; then
            echo 'Legacy PDF-format links remain in documentation source.'
            exit 1
          fi

      - name: Verify targeted diff
        run: |
          git diff -- src/data/tools.ts src/app/documentation/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Synchronize reconciliation MD
        run: |
          echo 'Reconciliation workflow completed source cleanup; MD synchronization is recorded by the workflow commit.'

      - name: Commit result and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/tools.ts src/app/documentation/page.tsx SEO_RELATED_TOOLS_REGISTRY_RECONCILIATION_2026-08-23.md
          git diff --cached --quiet || git commit -m 'SEO: remove archived related-tool links'
          git push
