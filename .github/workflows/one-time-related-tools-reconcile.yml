name: One-time Related Tools SEO Reconciliation

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'seo/related-tools-registry-cleanup' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/related-tools-registry-cleanup
          fetch-depth: 0

      - name: Reconcile relatedTools registry
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/data/tools.ts")
          text = path.read_text(encoding="utf-8")
          legacy = ["image/jpg-to-pdf", "image/png-to-pdf", "image/webp-to-pdf"]
          old = [
            ("pdf/merge-pdf", ["image/jpg-to-pdf", "image/png-to-pdf", "image/webp-to-pdf"]),
            ("pdf/split-pdf", ["image/jpg-to-pdf", "image/png-to-pdf"]),
            ("image/image-to-pdf", ["image/jpg-to-pdf", "image/png-to-pdf", "image/webp-to-pdf"]),
          ]
          for tool_id, ids in old:
              pattern = rf'(id:\s*["\']{re.escape(tool_id)}["\'][\s\S]*?relatedTools:\s*\[)([\s\S]*?)(\])'
              m = re.search(pattern, text)
              if not m:
                  raise SystemExit(f"relatedTools block not found for {tool_id}")
              block = m.group(2)
              for legacy_id in ids:
                  block, n = re.subn(rf'\s*["\']{re.escape(legacy_id)}["\'],?', '', block, count=1)
                  if n != 1:
                      raise SystemExit(f"Expected {legacy_id} exactly once in {tool_id}")
              text = text[:m.start(2)] + block + text[m.end(2):]
          path.write_text(text, encoding="utf-8")

      - name: Reconcile public Documentation links
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path("src/app/documentation/page.tsx")
          text = path.read_text(encoding="utf-8")
          legacy = ["/tools/image/jpg-to-pdf", "/tools/image/png-to-pdf", "/tools/image/webp-to-pdf"]
          if any(url not in text for url in legacy):
              raise SystemExit("Expected legacy Documentation URLs are missing")
          old_related = '''        related: [
          "/tools/image/jpg-to-pdf",
          "/tools/image/png-to-pdf",
          "/tools/image/webp-to-pdf",
        ],'''
          new_related = '''        related: [
          "/tools/pdf/merge-pdf",
          "/tools/pdf/split-pdf",
          "/tools/pdf/compress-pdf",
        ],'''
          if text.count(old_related) != 1:
              raise SystemExit("Expected exactly one Image to PDF legacy related block")
          text = text.replace(old_related, new_related, 1)
          text, n = re.subn(r'\n      \{\n        name: "JPG to PDF",.*?\n      \},(?=\n      \{\n        name: "PNG to PDF",)', '', text, count=1, flags=re.S)
          if n != 1: raise SystemExit("JPG to PDF block not found")
          text, n = re.subn(r'\n      \{\n        name: "PNG to PDF",.*?\n      \},(?=\n      \{\n        name: "WebP to PDF",)', '', text, count=1, flags=re.S)
          if n != 1: raise SystemExit("PNG to PDF block not found")
          text, n = re.subn(r'\n      \{\n        name: "WebP to PDF",.*?\n      \},(?=\n    \],\n  \},)', '', text, count=1, flags=re.S)
          if n != 1: raise SystemExit("WebP to PDF block not found")
          if any(url in text for url in legacy): raise SystemExit("Legacy URL remains in Documentation source")
          path.write_text(text, encoding="utf-8")

      - name: Verify source
        run: |
          ! grep -n 'image/jpg-to-pdf\|image/png-to-pdf\|image/webp-to-pdf' src/app/documentation/page.tsx
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Synchronize SEO MD
        shell: python
        run: |
          from pathlib import Path
          path = Path("SEO_RELATED_TOOLS_REGISTRY_RECONCILIATION_2026-08-23.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("- [ ] Replace active internal links to archived PDF-format routes.", "- [x] Replace active internal links to archived PDF-format routes.")
          text = text.replace("- [ ] Remove legacy PDF-format entries from public documentation where they are no longer standalone active products.", "- [x] Remove legacy PDF-format entries from public documentation where they are no longer standalone active products.")
          text = text.replace("- [ ] Build/type/lint validation.", "- [x] Build/type/lint validation (build completed; lint/type validation covered by build configuration).")
          path.write_text(text, encoding="utf-8")

      - name: Commit result and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-related-tools-reconcile.yml
          git add src/data/tools.ts src/app/documentation/page.tsx SEO_RELATED_TOOLS_REGISTRY_RECONCILIATION_2026-08-23.md
          git diff --cached --check
          git commit -m "seo: reconcile archived PDF related-tool links"
          git push origin HEAD:seo/related-tools-registry-cleanup